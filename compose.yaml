services:
  # Owns the HTTP API and local worker; databases remain on this instance's volume.
  api-engine:
    build: .
    command: ["serve", "--config", "/etc/api-engine/config.json"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - engine-data:/data
      - ./config/config.json:/etc/api-engine/config.json:ro
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GOMEMLIMIT: 768MiB
    mem_limit: 1g
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  engine-data:
